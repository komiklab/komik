services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: komik
      POSTGRES_PASSWORD: komik
      POSTGRES_DB: komik
    ports:
      - "5433:5432"
    volumes:
      - komikdb_data:/var/lib/postgresql/data
      - ./init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
    

volumes:
  komikdb_data: