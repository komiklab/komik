openapi: "3.0.3"
info:
  title: API Contracts for Komik
  version: "1.0"
servers:
  - url: https://api.server.test/v1
tags:
  - name: admin
  - name: auth
  - name: hook
  - name: auditlog
  - name: agent

paths:
  /agent/{id}:
    get:
      tags:
        - agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedAgentModel"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"  
  /agent:
    get:
      tags:
        - agent
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agentGetResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
    post:
      tags:
        - agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/agentCreateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
               $ref: "#/components/schemas/agentCreateResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /hook/slack:
    post:
      tags:
        - hook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /auth/oidc/login:
    get:
      tags:
        - auth
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /auth/oidc/callback:
    get:
      tags:
        - auth
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string  
      responses:
        "302":
          description: Found
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"  
  /auth/login:
    post:
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/adminCreateRequest"
      responses:
        "200":
          description: OK
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /auth/logout:
    post:
      tags:
        - auth
      responses:
        "302":
          description: Found
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /auth/me:
    get:
      tags:
        - auth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/userResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /admin:
    get:
      tags:
        - admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/adminGetResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
    post:
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/adminCreateRequest"
      responses:
        "201":
          description: Created
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /auditlog:
    get:
      tags:
        - auditlog
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            example: 25
        - name: offset
          in: query
          required: true
          schema:
            type: integer
            example: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auditlogGetResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
components:
  schemas:
    agentGetResponse:
      type: object
      properties:
        agents: 
          type: array
          items:
            $ref: "#/components/schemas/agentModel"
    agentModel:
      type: object
      properties:
        agentID:
          type: string
          format: uuid
        name:
          type: string
    DetailedAgentModel:
      type: object
      allOf:
        - $ref: '#/components/schemas/agentModel'
        - $ref: '#/components/schemas/agentCreateRequest'
      
    agentCreateResponse:
      type: object
      required:
        - agentID
        - name
      properties:
        agentID:
          type: string
          format: uuid
        name:
          type: string
    agentCreateRequestResources:
      type: object
      properties:
        memory:
          type: string
          example: "256Mi"
        cpu:
          type: string
          example: "512m"
        ephemeralStorage:
          type: string
          example: "1Gi"
        timeoutSeconds:
          type: integer
          example: 3600
    agentCreateRequest:
      type: object
      required:
        - name
        - image
      properties:
        name:
          type: string
        description:
          type: string
        image:
          type: string
          example: "ghcr.io/komiklab/komikagent:v1"
        imagePullSecret:
          type: string
          example: "my-secret"
        resources: 
          type: object
          $ref: '#/components/schemas/agentCreateRequestResources'
        env:
          type: array
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
              value:
                type: string
        secrets:
          type: array
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
              value:
                type: string
        annotations:
          type: array
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
              value:
                type: string
    auditlogGetResponse:
      type: object
      properties:
        metadata:
          type: object
          properties:
            total:
              type: integer
              example: 100
            limit:
              type: integer
              example: 25
            offset:
              type: integer
              example: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/auditlogResponse"
    auditlogResponse:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        event_version:
          type: integer
        occurred_at:
          type: string
          format: date-time
        correlation_id:
          type: string
        initiator_id:
          type: string
        initiator_type:
          type: string
        resource_type:
          type: string
        severity:
          type: string
        data:
          type: string
    slackEventRequest:
      type: object
      required:
        - type
        - challenge
        - token
      properties:
        type:
          type: string
        challenge:
          type: string
        token:
          type: string
    userResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          format: email
    errorResponse:
      type: object
      properties:
        error_code:
          type: string
        error_message:
          type: string
    adminGetResponse:
      type: object
      required:
        - exists
      properties:
        exists:
          type: boolean
    adminCreateRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
