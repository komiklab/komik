apiVersion: v2
name: komik
description: A Helm chart for Kubernetes
type: application
version: 0.1.0
appVersion: "1.16.0"
dependencies:
  - name: postgresql
    repository: "oci://registry-1.docker.io/bitnamicharts"
    version: 18.4.0
    condition: postgresql.enabled
  - name: nats
    repository: https://nats-io.github.io/k8s/helm/charts
    version: 2.14.0
    condition: nats.enabled

