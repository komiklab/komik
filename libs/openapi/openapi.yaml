openapi: "3.0.3"
info:
  title: API Contracts for Komik
  version: "1.0"
servers:
  - url: https://api.server.test/v1
tags:
  - name: admin
  - name: auth
  - name: hook
  - name: auditlog
  - name: agent

paths:
  /agent/{id}:
    get:
      tags:
        - agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedAgentModel"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"  
  /agent:
    get:
      tags:
        - agent
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agentGetResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
    post:
      tags:
        - agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/agentCreateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
               $ref: "#/components/schemas/agentCreateResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /hook:
    get:
      tags:
        - hook
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/hookRegisteredList"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
    post:
      tags: 
        - hook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/hookRegisterRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/hookregisterResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /hook/{id}:
    post:
      tags:
        - hook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/hookSendRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /hook/slack:
    post:
      tags:
        - hook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /auth/oidc/login:
    get:
      tags:
        - auth
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /auth/oidc/callback:
    get:
      tags:
        - auth
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string  
      responses:
        "302":
          description: Found
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"  
  /auth/login:
    post:
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/adminCreateRequest"
      responses:
        "200":
          description: OK
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /auth/logout:
    post:
      tags:
        - auth
      responses:
        "302":
          description: Found
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /auth/me:
    get:
      tags:
        - auth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/userResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /admin:
    get:
      tags:
        - admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/adminGetResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
    post:
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/adminCreateRequest"
      responses:
        "201":
          description: Created
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /auditlog:
    get:
      tags:
        - auditlog
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            example: 25
        - name: offset
          in: query
          required: true
          schema:
            type: integer
            example: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auditlogGetResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
components:
  schemas:
    hookregisterResponse:
      type: object
      allOf:
        - $ref: "#/components/schemas/hookRegisterRequest"
      properties:
        id:
          type: string
          format: uuid
          description: "The id of the hook."
          example: "123e4567-e89b-12d3-a456-426614174000"
        secretKey:
          type: string
          description: "The secret key to send with the hook."
          example: "T01A01B01C01"
        createdAt:
          type: string
          format: date-time
          description: "The creation time of the hook."
          example: "2022-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: "The update time of the hook."
          example: "2022-01-01T00:00:00Z"
    hookRegisterRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    hookRegisteredList:
      type: object
      properties:
        hooks:
          type: array
          items:
            $ref: "#/components/schemas/hookregisterResponse"
    hookSendRequest:
      type: object
      required:
        - reference
        - message
      properties:
        reference:
          type: string
          description: "The reference to send the hook to."
          example: "T01A01B01C01"
        message:
          type: object
          description: "The message to send to the hook."
        initiator: 
          type: string
          description: "The initiator of the hook."
          example: "user"
    agentGetResponse:
      type: object
      properties:
        agents: 
          type: array
          items:
            $ref: "#/components/schemas/agentModel"
    agentModel:
      type: object
      properties:
        agentID:
          type: string
          format: uuid
        name:
          type: string
    DetailedAgentModel:
      type: object
      allOf:
        - $ref: '#/components/schemas/agentModel'
        - $ref: '#/components/schemas/agentCreateRequest'
      
    agentCreateResponse:
      type: object
      required:
        - agentID
        - name
      properties:
        agentID:
          type: string
          format: uuid
        name:
          type: string
    agentCreateRequest:
      type: object
      required:
        - name
        - endpoint
        - description
        - parameters
        - capabilities
      properties:
        name:
          type: string
        description:
          type: string
        endpoint:
          type: string
        capabilities:
          type: array
          items:
            type: string
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/agentCreateRequestParameter"
        tags: 
          type: array
          items:
            type: string
    agentCreateRequestParameter:
      type: object
      required:
        - description
        - type
      properties:
        type:
          type: string
        description:
          type: string
        required:
          type: boolean

    auditlogGetResponse:
      type: object
      properties:
        metadata:
          type: object
          properties:
            total:
              type: integer
              example: 100
            limit:
              type: integer
              example: 25
            offset:
              type: integer
              example: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/auditlogResponse"
    auditlogResponse:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        event_version:
          type: integer
        occurred_at:
          type: string
          format: date-time
        correlation_id:
          type: string
        initiator_id:
          type: string
        initiator_type:
          type: string
        resource_type:
          type: string
        severity:
          type: string
        data:
          type: string
    slackEventRequest:
      type: object
      required:
        - type
        - challenge
        - token
      properties:
        type:
          type: string
        challenge:
          type: string
        token:
          type: string
    userResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          format: email
    errorResponse:
      type: object
      properties:
        error_code:
          type: string
        error_message:
          type: string
    adminGetResponse:
      type: object
      required:
        - exists
      properties:
        exists:
          type: boolean
    adminCreateRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
